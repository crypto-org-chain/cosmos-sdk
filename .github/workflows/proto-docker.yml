name: Build & Push SDK Proto Builder
on:
  push:
    branches:
      - main
    paths:
      - "contrib/devtools/Dockerfile"
  workflow_dispatch:
    inputs:
      tags:
        description: "Docker image tags"
        required: true
        type: string
  pull_request:
    paths:
      - "contrib/devtools/Dockerfile"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cosmos/proto-builder

# Allow one concurrent deployment
concurrency:
  group: "proto-docker"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Images go to cosmos-owned packages, which only the upstream repository can push to.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.repository == 'cosmos/cosmos-sdk' }}
    permissions:
      contents: read
      packages: write

    steps:
      # set VERSION to new version when making changes, when merged to main the image will automatically be pushed
      - uses: actions/checkout@v6

      - name: Set up QEMU
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # modify value when deploying a new version
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tags }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        if: ${{ env.PUBLISH == 'true' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GHCR
        uses: docker/build-push-action@v7
        with:
          context: ./contrib/devtools
          # arm64 builds under QEMU, so only publishing runs build it.
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
